# .github/actions/validate-dockerhub-creds/action.yml
name: Validate Docker Hub credentials
description: Fail early if DOCKER_USERNAME or DOCKER_PASSWORD is empty.

inputs:
  docker-username:
    description: 'Docker Hub username (pass secrets.DOCKER_USERNAME)'
    required: true
  docker-password:
    description: 'Docker Hub password or PAT (pass secrets.DOCKER_PASSWORD)'
    required: true

runs:
  using: composite
  steps:
    - name: Check credentials are present
      shell: bash
      env:
        DOCKER_USERNAME: ${{ inputs.docker-username }}
        DOCKER_PASSWORD: ${{ inputs.docker-password }}
      run: |
        # `required: true` on the action inputs above only validates that the
        # caller passed the keys — it does NOT catch empty-string values that
        # come from unset secrets. The runtime `-z` checks below are the real
        # guard. Do not delete them.
        missing=()
        [ -z "$DOCKER_USERNAME" ] && missing+=("DOCKER_USERNAME")
        [ -z "$DOCKER_PASSWORD" ] && missing+=("DOCKER_PASSWORD")
        if [ "${#missing[@]}" -gt 0 ]; then
          echo "::error::Docker Hub credentials missing: ${missing[*]}. Set the named secret(s) in the calling repository."
          exit 1
        fi
        echo "Docker Hub credentials present for user '${DOCKER_USERNAME}'."
