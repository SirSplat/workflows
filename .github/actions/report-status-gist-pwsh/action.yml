# .github/actions/report-status-gist-pwsh/action.yml
name: Report status to gist (PowerShell)
description: >-
  PowerShell-native sibling of report-status-gist. Best-effort PATCH of a
  shields.io-shaped status payload to a gist file via Invoke-RestMethod —
  no bash / gh / jq dependency, so it runs on the self-hosted Windows
  runners (default shell: pwsh) where those tools are not guaranteed
  present. Non-fatal; logs a warning if it cannot complete after 8 attempts.

inputs:
  gist-id:
    description: 'Gist ID to PATCH. If empty, the action is a no-op.'
    required: false
    default: ''
  filename:
    description: 'Filename within the gist to write (e.g. "goapplugin-ue57.json").'
    required: true
  label:
    description: 'Shields.io label (left side of the badge).'
    required: true
  message:
    description: 'Shields.io message (right side of the badge).'
    required: true
  color:
    description: 'Shields.io color (e.g. brightgreen, red, lightgrey).'
    required: true
  gh-token:
    description: 'Token with gist write scope. If empty, the action is a no-op.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: PATCH gist with retry+jitter
      shell: pwsh
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        GIST_ID: ${{ inputs.gist-id }}
        FILENAME: ${{ inputs.filename }}
        LABEL: ${{ inputs.label }}
        MESSAGE: ${{ inputs.message }}
        COLOR: ${{ inputs.color }}
      run: |
        # The action is a configured no-op when either the token or the gist
        # id is empty. This lets the calling workflow add the step
        # unconditionally and have it cleanly skip until the GIST_TOKEN secret
        # is wired (parity with the bash report-status-gist no-op behaviour).
        $token = $env:GH_TOKEN
        $gistId = $env:GIST_ID
        if ([string]::IsNullOrEmpty($token) -or [string]::IsNullOrEmpty($gistId)) {
          Write-Host "report-status-gist-pwsh: gh-token or gist-id empty; skipping (configured no-op)."
          exit 0
        }

        # Build the shields.io endpoint payload. The gist FILE CONTENT is the
        # JSON string {schemaVersion,label,message,color}; the gist PATCH body
        # wraps it as {files: {<filename>: {content: <that-json-string>}}}.
        # ConvertTo-Json -Compress on the inner object, then embed as a string
        # value in the outer object — mirrors the bash action's two jq passes.
        $statusObj = [ordered]@{
          schemaVersion = 1
          label         = $env:LABEL
          message       = $env:MESSAGE
          color         = $env:COLOR
        }
        $statusJson = $statusObj | ConvertTo-Json -Compress
        $body = @{
          files = @{
            "$($env:FILENAME)" = @{ content = $statusJson }
          }
        } | ConvertTo-Json -Depth 5 -Compress

        $headers = @{
          Authorization          = "Bearer $token"
          Accept                 = "application/vnd.github+json"
          "X-GitHub-Api-Version" = "2022-11-28"
          "User-Agent"           = "sirsplat-report-status-gist-pwsh"
        }
        $uri = "https://api.github.com/gists/$gistId"

        # The gist API serialises writes; concurrent matrix legs all PATCHing
        # the same gist trigger HTTP 409/422. Retry with backoff plus jitter.
        # A persistent failure here is non-fatal — a stale badge is preferable
        # to a red build on a presentation-only side-effect.
        for ($attempt = 1; $attempt -le 8; $attempt++) {
          try {
            Invoke-RestMethod -Method Patch -Uri $uri -Headers $headers `
              -Body $body -ContentType "application/json" | Out-Null
            Write-Host "report-status-gist-pwsh: wrote $($env:FILENAME) on attempt $attempt."
            exit 0
          } catch {
            if ($attempt -lt 8) {
              $sleep = ($attempt * 3) + (Get-Random -Minimum 0 -Maximum 5)
              Write-Host "Gist update attempt $attempt/8 failed ($($_.Exception.Message)); retrying in ${sleep}s..."
              Start-Sleep -Seconds $sleep
            }
          }
        }
        Write-Host "::warning::Gist status update still failing after 8 attempts; badge may be stale."
        exit 0
